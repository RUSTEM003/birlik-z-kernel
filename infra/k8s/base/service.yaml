apiVersion: v1
kind: Service
metadata:
  name: z-kernel-core
  namespace: birlik-platform
  labels:
    app: z-kernel-core
    component: core
spec:
  selector:
    app: z-kernel-core
  ports:
  - name: z-agent-engine
    port: 8000
    targetPort: 8000
  - name: dao-intent-router
    port: 8001
    targetPort: 8001
  - name: z-voice-interface
    port: 8002
    targetPort: 8002
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: api-services
  namespace: birlik-platform
  labels:
    app: api-services
    component: api
spec:
  selector:
    app: api-services
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: birlik-platform
  labels:
    app: web-frontend
    component: frontend
spec:
  selector:
    app: web-frontend
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  type: ClusterIP
